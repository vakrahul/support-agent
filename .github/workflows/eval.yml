name: eval

on:
  push:
    branches: [main]
  workflow_dispatch:   # manual "Run pipeline" button on the Actions tab
    inputs:
      mode:
        description: 'LLM evaluation mode (replay is $0 cached, live calls Gemini API)'
        required: true
        default: 'replay'
        type: choice
        options:
          - replay
          - live

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LLM_MODE: ${{ inputs.mode || 'replay' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tests (101) — no data, no key
        run: python -m pytest tests/ -q

      - name: Leakage check — must PASS (fails the build on contamination)
        run: python scripts/check_leakage.py

      - name: Replay eval — reproduce the headline table ($0, cached LLM)
        run: python scripts/run_eval.py --skip-judge

      - name: Bank judge verdicts from committed cache (no network)
        run: python scripts/bank_judges.py

      - name: Paired judge-vs-human agreement (n=50 banked)
        run: python scripts/pair_agreement.py

      - name: Customer query diagnostic inspector (demo.py on 4 archetypes)
        run: python scripts/demo.py --featured

      - name: Render results into the job summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          # Results — regenerated from scratch on GitHub's runner
          _No API key, no Kaggle dump: replay cache + committed index only. Same
          numbers as the README table or the build fails._
          EOF
          # Numbers below are extracted live from outputs/ so the summary can
          # never go stale vs the JSON the eval and demo just wrote.
          python - <<'PYEOF'
          import json, os
          res = json.load(open("outputs/eval_results.json"))
          s = res["systems"]
          def row(name, key):
              x = s[key]
              return (f"| {name} | {x['accuracy']:.3f} | {x['macro_f1']:.3f} | "
                      f"{x['esc_precision']:.2f} / {x['esc_recall']:.2f} | "
                      f"{x['false_auto']:.3f} | {x['coverage']:.2f} |")
          
          # Dynamic featured demo table extraction
          demo_data = json.load(open("outputs/featured_demo.json")) if os.path.exists("outputs/featured_demo.json") else []
          demo_rows = []
          for d in demo_data:
              q = d["query"].replace("\n", " ").replace("|", "\\|").strip()
              draft = d["draft"].replace("\n", " ").replace("|", "\\|").strip()
              dec = f"`{d['decision'].upper()}`" if d["decision"] == "auto" else "`ESCALATE`"
              code = f"`{d['reason_code']}`"
              demo_rows.append(f"| `{d['id']}` | {d['archetype']} | *\"{q[:65]}...\"* | *\"{draft[:85]}...\"* | {dec} | {code} |")
          demo_table = "\n".join(demo_rows)

          ja = json.load(open("outputs/judge_agreement.json"))
          summary = f"""
          ## Systems (frozen test-100)

          | system | intent acc | macro-F1 | esc P / R | unsafe | coverage |
          |---|---|---|---|---|---|
          {row("B0 trivial", "B0_trivial")}
          {row("B1 simple (TF-IDF)", "B1_tfidf")}
          {row("**Ours (LLM + RAG + gate)**", "ours_llm")}

          ## Real Customer Query Demonstrations (`scripts/demo.py --featured`)

          | Sample ID | Archetype | Customer Query | Drafted Support Reply | Gate Decision | Reason Code |
          |---|---|---|---|---|---|
          {demo_table}

          ## System & Model Architecture Specifications

          - **Vector Embedding Model**: `sentence-transformers/all-MiniLM-L6-v2` (384-dimensional dense semantic vectors, normalized cosine similarity).
          - **Pluggable Offline Fallback**: `TfidfSvdEmbedder` (`src/retrieve/embeddings.py`) implemented natively in NumPy with zero torch dependencies, clamping precision@1 ≥ 0.80.
          - **Vector Precedent Storage**: Embedded Qdrant (`qdrant_storage/`, local file storage, zero Docker or cloud API dependencies).
          - **Grounding Corpus**: 3,334 verified, deflection-free English AmazonHelp resolution threads.
          - **Intent Classifier & Generator**: Few-shot JSON schema prompting using `gemini-3.1-flash-lite`, with 100% deterministic offline replay cache ($0 compute, 436 banked responses).
          - **6-Point Policy Safety Gate**: Strict deterministic verification enforcing `conf_thr=0.70`, `sim_thr=0.60`, `agree_thr=2/3`, zero risk triggers, grounding validator pass, and known operational intent.

          ## Judge validation (paired vs human, n={ja['n_paired']})

          Spearman rho={ja['spearman_rho']} · binned kappa={ja['binned_kappa']} ·
          judge {ja['llm_judge_mean']} vs human {ja['human_mean']} —
          weak per-item agreement, humans stay primary (stated, not hidden).

          ## Artifacts
          - Full runs: outputs/eval_results.json
          - Featured demos: outputs/featured_demo.json
          - Coverage-vs-unsafe curve: outputs/coverage_curve.json
          - Gate/retrieval ablations: outputs/retrieval_ablation.json
          - Judge pairs: outputs/judge_agreement.json
          """
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(summary)
          PYEOF
